{% load bootstrap4 %}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Test Chat</title>
        {% bootstrap_css %}
    </head>
    <body>
        <div class="container">
            Qual sala de chat você gostaria de entrar?<br/>
            <input id="nome_sala" name="nome_sala" type="text" size="100" placeholder="Digite o nome da sala"><br/>
            {% buttons %}
                <input id="botao" class="btn btn-primary" type="button" value="Entrar" />
            {% endbuttons %}
        </div>
        <script>
            document.querySelector('#nome_sala').focus();
            document.querySelector('#nome_sala').onkeyup = function(e){
                if(e.keyCode === 13){
                    document.querySelector('#botao').click();
                }
            };
            document.querySelector('#botao').onclick = function(){
                var nome_sala = document.querySelector('#nome_sala').value;
                if(nome_sala != ""){
                    window.location.pathname = '/chat/' + nome_sala + '/';
                } else {
                    alert('Você precisa digitar o nome da sala.');
                    document.querySelector('#nome_sala').focus();
                }
            };
        </script>
        {% bootstrap_javascript jquery='full' %}
    </body>
</html>
